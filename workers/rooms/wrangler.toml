name = "lemon-rooms"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# One Durable Object per shared project — the S4 realtime room (docs/COLLABORATION.md §6 S4).
# The room runs the SAME pure reducer the app runs, so an action means exactly the same
# thing everywhere (multiplayer by construction, no per-feature sync code).
#
# Local dev: the dev server auto-starts the worker through the shared launcher
# (tools/rooms-dev.mjs — reuse or spawn from the MAIN tree, so parallel
# worktrees share ONE worker, this .dev.vars and the DO state). Manual foreground
# equivalent: `node tools/rooms-dev.mjs serve` from the repo root. `.dev.vars`
# (gitignored) sets DEV_AUTH=1, which accepts `dev:<userId>:<role>` tokens;
# deployed envs use ROOM_TOKEN_SECRET instead (`npx wrangler secret put
# ROOM_TOKEN_SECRET`, shared with the Supabase Edge Function).

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Workers Logs — retained, queryable worker logs (Observability API / dashboard).
# Added during the 229 live pass: `wrangler tail` is live-only, and the first
# production incident had NO retained logs to read (found: observability was
# never enabled, so the telemetry dataset was empty). Security events only —
# the worker never logs tokens or content.
[observability]
enabled = true
