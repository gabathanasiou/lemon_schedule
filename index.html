<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Status-bar / browser tint (roadmap 265): kept in sync per project theme
         by useStatusBarTheme(); this is the boot-screen zinc-950 default. Never
         add apple-mobile-web-app-status-bar-style (deprecated). No
         viewport-fit=cover HERE — phone portrait opts in at boot instead
         (main.tsx, roadmap 267); the system bar sits above the page by design. -->
    <meta name="theme-color" content="#09090b" />
    <!-- Roadmap 285: keep cross-origin referrers at origin level (the Google
         Maps key's HTTP-referrer restriction reads them). The CSP itself is
         injected by the `csp` plugin from src/lib/csp.ts (dev gets a relaxed
         variant) — not written here. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Lemon Schedule</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="portal" style="position: fixed; left: 0; top: 0; z-index: 9999;" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
