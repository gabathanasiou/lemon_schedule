<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Status-bar / browser tint (roadmap 265): kept in sync per project theme
         by useStatusBarTheme(); this is the boot-screen zinc-950 default. Never
         add apple-mobile-web-app-status-bar-style (deprecated). No
         viewport-fit=cover HERE — phone portrait opts in at boot instead
         (main.tsx, roadmap 267); the system bar sits above the page by design. -->
    <meta name="theme-color" content="#09090b" />
    <!-- Roadmap 285: keep cross-origin referrers at origin level (the Google
         Maps key's HTTP-referrer restriction reads them). The CSP itself is
         injected by the `csp` plugin from src/lib/csp.ts (dev gets a relaxed
         variant) — not written here. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Resource hints (audit P6). accounts.google.com hosts the Google Identity
         Services client that GoogleOAuthProvider injects at boot when a client
         ID is configured, so it is on the first screen's critical path — warm
         DNS + TLS from the HTML instead of after the bundle runs. dns-prefetch
         is the cheap fallback for engines that skip preconnect. No `preload` for
         gsi/client itself: Google versions that URL, so a hard-coded href would
         404 on rotation. The Supabase origin is hinted from main.tsx (it comes
         from the deploy env, so it cannot be written here). -->
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://accounts.google.com" />
    <title>Lemon Schedule</title>
    <!-- First-paint shell (audit P2). Critical CSS for the static lockup below:
         it paints from the HTML alone, so a cold load shows the branded zinc-950
         canvas instead of a white page while the entry bundle downloads and
         boots. `style-src` allows inline styles; `script-src` does not, so this
         stays pure HTML + CSS. Mirrors ProjectManagerBoot's backdrop + bottom-
         right lockup so the handover is invisible. Text only — no images, no
         fonts, no extra requests. -->
    <style>
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0 max(1.25rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) 0;
        background: #09090b;
        color: #52525b;
        font: 600 10px/1 "Helvetica Neue", Helvetica, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- React clears the container on its first render (createRoot) — never
           remove this from script, and never add anything interactive here. -->
      <div id="boot-shell" aria-hidden="true">Lemon Schedule</div>
    </div>
    <div id="portal" style="position: fixed; left: 0; top: 0; z-index: 9999;" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
