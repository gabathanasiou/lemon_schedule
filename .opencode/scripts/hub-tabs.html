<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Worker preview tabs</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0c0c0e; color: #e4e4e7; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px; background: #16161a; border-bottom: 1px solid #27272a; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
  .tab { font: inherit; font-size: 13px; color: #a1a1aa; background: #1f1f23; border: 1px solid #2e2e33; border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; flex: 0 0 auto; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { background: #26262b; color: #fff; }
  .tab.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .tab .port { opacity: .55; margin-left: 6px; font-size: 11px; }
  .back { font: inherit; font-size: 12px; color: #93c5fd; background: transparent; border: 1px solid #1d4ed8; border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; flex: 0 0 auto; text-decoration: none; }
  .back:hover { background: #1e3a8a; color: #fff; }
  .panel { display: none; height: calc(100vh - 104px); }
  .panel.active { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 12px; color: #71717a; background: #101013; border-bottom: 1px solid #1f1f23; }
  .bar button { font: inherit; font-size: 11px; background: #1f1f23; border: 1px solid #2e2e33; color: #a1a1aa; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .hint { margin-left: auto; font-size: 11px; color: #52525b; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .workers { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; background: #101013; border-bottom: 1px solid #27272a; }
  .wrow { display: flex; align-items: center; gap: 10px; font-size: 12px; min-width: 0; }
  .wname { font-weight: 600; color: #d4d4d8; white-space: nowrap; }
  .wdoing { color: #8b8b94; font-style: italic; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow button { font: inherit; font-size: 11px; background: #1f1f23; border: 1px solid #2e2e33; color: #a1a1aa; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  .wrow button:hover { background: #26262b; color: #fff; }
  .wurl { color: #60a5fa; font-size: 11px; text-decoration: none; white-space: nowrap; }
  .wurl:hover { text-decoration: underline; }
  .whead { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #52525b; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="tabs">
  <a class="back" href="/" title="Back to the hub manager">← Manager</a>
  <button class="tab active" data-panel="pmain">main<span class="port">3000</span></button>
  __TABS__
</div>
<div class="workers" id="workers"><div class="whead">Workers</div></div>
<div class="panel active" id="pmain"><div class="bar">main — port 3000 <button class="reload">Reload</button><span class="hint">project data is shared across tabs</span></div><iframe data-src="3000"></iframe></div>
__PANELS__
<script>
  // Host-aware iframes — works from the Mac AND from LAN devices (iPad),
  // where "localhost" would point at the device itself.
  document.querySelectorAll('iframe[data-src]').forEach(f => { f.src = 'http://' + location.hostname + ':' + f.dataset.src; });

  // --- tab switching + reload ---
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.panel').forEach(pp => pp.classList.toggle('active', pp.id === t.dataset.panel));
  }));
  document.querySelectorAll('.reload').forEach(b => b.addEventListener('click', () => {
    const pp = b.closest('.panel'); const f = pp.querySelector('iframe');
    const base = f.src.split('?')[0];
    f.src = base + '?t=' + Date.now();
  }));

  // --- workers strip: live status, what they're doing, start/stop, LAN URLs ---
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const host = location.hostname;
  async function refreshWorkers() {
    try {
      const s = await (await fetch('/api/status')).json();
      const rows = s.items.map(it => {
        const on = it.running === 'yes' || it.running === 'external';
        return '<div class="wrow"><span class="dot ' + it.running + '"></span>' +
          '<span class="wname" title="' + esc(it.label) + '">' + esc(it.label) + '</span>' +
          '<span class="wdoing" title="' + esc(it.doing) + '">' + (it.doing ? esc(it.doing) : on ? 'running' : 'stopped') + '</span>' +
          '<button onclick="wctl(\'start/' + it.item + '\')">Start</button>' +
          '<button onclick="wctl(\'stop/' + it.item + '\')">Stop</button>' +
          '<a class="wurl" href="http://' + host + ':' + it.port + '" target="_blank">' + host + ':' + it.port + '</a>' +
          '</div>';
      }).join('');
      document.getElementById('workers').innerHTML = '<div class="whead">Workers — shared project data · one refresh after first load if the list looks empty</div>' + rows;
    } catch (err) { /* hub restarting — retry */ }
  }
  async function wctl(cmd) { try { await fetch('/api/' + cmd, { method: 'POST' }); } catch (err) {} setTimeout(refreshWorkers, 700); }
  refreshWorkers();
  setInterval(refreshWorkers, 4000);

  // --- shared localStorage store (parent side of the hub-bridge) ---
  // Safety: the MAIN frame is the only authoritative writer. Worker frames
  // are read-only consumers — their writes stay in their own origin, so a
  // worker's stale/in-progress data can never poison the shared store.
  const store = new Map();
  const frames = new Set();
  const mainFrame = document.querySelector('iframe[data-src="3000"]');
  const isMain = (e) => mainFrame && mainFrame.contentWindow === e.source;
  const broadcast = (type, data) => { for (const f of frames) f.postMessage({ hubBridge: 'store', type, data }, '*'); };
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.hubBridge !== 'hello' && d.hubBridge !== 'set' && d.hubBridge !== 'remove' && d.hubBridge !== 'clear') return;
    if (d.hubBridge === 'hello') {
      frames.add(e.source);
      if (isMain(e)) {
        for (const k in d.native || {}) if (k.indexOf('lemon_schedule_') === 0) store.set(k, d.native[k]);
      }
      e.source.postMessage({ hubBridge: 'store', type: 'snapshot', data: Object.fromEntries(store) }, '*');
    } else if (isMain(e)) {
      if (d.hubBridge === 'set') {
        store.set(d.key, d.value);
        broadcast('set', d);
      } else if (d.hubBridge === 'remove') {
        store.delete(d.key);
        broadcast('remove', d);
      } else if (d.hubBridge === 'clear') {
        store.clear();
        broadcast('clear');
      }
    }
  });
</script>
</body>
</html>
