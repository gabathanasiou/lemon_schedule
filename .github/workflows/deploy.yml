name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authenticate git for private deps (@gabriel/ui-kit)
        run: |
          git config --global --add url."https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: DEBUG auth
        run: |
          echo CONFIG_B64=$(git config --global --get-regexp url | base64 -w0)
          echo CURL=$(curl -s -o /dev/null -w "%{http_code}" -u "x-access-token:${{ secrets.UI_KIT_TOKEN }}" "https://github.com/gabathanasiou/ui-kit.git/info/refs?service=git-upload-pack")
          echo SSHKEY=$(ls -la ~/.ssh/ 2>/dev/null | wc -l)
      - run: npm ci
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
