# Supabase project configuration (roadmap 229). Scope: the S4 `room-token`
# Edge Function + the migration ledger under `supabase/migrations/`. The app
# never runs the local Docker stack (`supabase start`), so this stays minimal.
# `project_id` is the local-stack identity — keep it stable across worktrees.
project_id = "lemon_schedule"

[functions.room-token]
# The app sends the caller's Supabase access token (`src/lib/rooms/tokenClient.ts`);
# the gateway rejects missing/invalid JWTs before the function runs, and the
# function verifies the caller again itself (never trusts one gate alone).
# Deploy: `npx supabase functions deploy room-token --project-ref <ref> --use-api`
verify_jwt = true

[functions.delete-account]
# Roadmap 281 (audit F9) + 294. Same double gate as room-token; the function
# deletes the CALLER only — never an id from the request body. It archives the
# full footprint via `archive_account` FIRST (30-day internal recovery window,
# purged daily by `account-archive-purge`; runbook docs/COLLABORATION.md
# §account restore) and ABORTS if archiving fails. Every auth.users FK
# cascades, so owned projects (and collaborator access to them) die with the
# account; the app's confirm dialog says so.
# Deploy: `npx supabase functions deploy delete-account --project-ref <ref> --use-api`
# Deploy ORDER matters: apply migration 20261016142825 (the archive_account
# RPC) BEFORE this function — the function depends on it, and the reverse
# order would delete without archiving.
verify_jwt = true
